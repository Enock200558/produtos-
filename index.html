<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro GASOtec</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }
    .sub {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 18px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 4px;
      margin-top: 10px;
    }
    label:first-child { margin-top: 0; }
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #22c55e;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 10px;
      font-size: 0.85rem;
      min-height: 20px;
    }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
    }
    .item:last-child { border-bottom: none; }
    .nome { font-weight: 700; font-size: 1rem; }
    .meta { color: #94a3b8; font-size: 0.85rem; margin-top: 2px; }
    .btn-del {
      width: auto;
      margin-top: 0;
      padding: 8px 12px;
      background: #ef4444;
      color: #fff;
      font-size: 0.85rem;
      border-radius: 6px;
    }
    .vazio {
      color: #94a3b8;
      font-size: 0.9rem;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cadastro GASOtec</h1>
    <div class="sub">Sistema conectado ao Supabase</div>

    <div class="card">
      <form id="formProduto">
        <label for="nome">Nome do produto</label>
        <input id="nome" type="text" placeholder="Ex.: Arroz 25kg" required />

        <label for="preco">Preço</label>
        <input id="preco" type="number" step="0.01" min="0" placeholder="Ex.: 15000" required />

        <label for="quantidade">Quantidade</label>
        <input id="quantidade" type="number" min="0" placeholder="Ex.: 10" required />

        <button id="btnSalvar" type="submit">Salvar produto</button>
        <div id="msg" class="msg"></div>
      </form>
    </div>

    <div class="card">
      <h2 style="font-size: 1.1rem; margin: 0 0 8px 0;">Produtos cadastrados</h2>
      <div id="lista"><div class="vazio">A carregar...</div></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qbysnrmblewlspnqjrbg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LEB0U2WWBhwQijoccGQSgA_MI_YqKnu';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('formProduto');
    const msg = document.getElementById('msg');
    const lista = document.getElementById('lista');
    const btnSalvar = document.getElementById('btnSalvar');

    function setMsg(texto, tipo = 'ok') {
      msg.textContent = texto;
      msg.className = `msg ${tipo}`;
    }

    async function carregarProdutos() {
      const { data, error } = await db
        .from('produtos')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        lista.innerHTML = `<div class="vazio" style="color:#f87171;">Erro ao carregar: ${error.message}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        lista.innerHTML = `<div class="vazio">Nenhum produto cadastrado ainda.</div>`;
        return;
      }

      lista.innerHTML = data.map(p => `
        <div class="item">
          <div>
            <div class="nome">${escaparHtml(p.nome)}</div>
            <div class="meta">Preço: ${Number(p.preco)} • Qtd: ${Number(p.quantidade)}</div>
          </div>
          <button class="btn-del" onclick="apagarProduto(${p.id})">Apagar</button>
        </div>
      `).join('');
    }

    function escaparHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const preco = parseFloat(document.getElementById('preco').value);
      const quantidade = parseInt(document.getElementById('quantidade').value, 10);

      if (!nome || Number.isNaN(preco) || Number.isNaN(quantidade)) {
        setMsg('Preencha todos os campos corretamente.', 'err');
        return;
      }

      btnSalvar.disabled = true;
      setMsg('A guardar...', 'ok');

      const { error } = await db
        .from('produtos')
        .insert([{ nome, preco, quantidade }]);

      btnSalvar.disabled = false;

      if (error) {
        setMsg(`Erro ao guardar: ${error.message}`, 'err');
        return;
      }

      form.reset();
      setMsg('Produto guardado com sucesso!', 'ok');
      carregarProdutos();
    });

    async function apagarProduto(id) {
      const { error } = await db
        .from('produtos')
        .delete()
        .eq('id', id);

      if (error) {
        setMsg(`Erro ao apagar: ${error.message}`, 'err');
        return;
      }

      setMsg('Produto removido.', 'ok');
      carregarProdutos();
    }

    carregarProdutos();
  </script>
</body>
  </html>
